# Compila la APK firmada y la publica en Releases (vial.apk = última versión).
# Se lanza desde el panel admin de la app (función vial-admin) o manualmente.
name: App Android
on:
  workflow_dispatch:
    inputs:
      version_code: { description: 'versionCode (entero creciente)', required: true, default: '1' }
      version_name: { description: 'versionName', required: true, default: '1.0' }
permissions: { contents: write }
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Llave de firma
        run: echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/vial.p12"
      - name: Compilar
        env:
          KS_PATH: ${{ runner.temp }}/vial.p12
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle -p android assembleRelease -PversionCode=${{ inputs.version_code }} -PversionName=${{ inputs.version_name }} --no-daemon
      - name: Preparar archivos
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk vial.apk
          cp vial.apk "vial-${{ inputs.version_name }}.apk"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version_name }}
          name: Vial ${{ inputs.version_name }}
          body: Versión ${{ inputs.version_name }} (código ${{ inputs.version_code }}) de la app Vial Quito.
          files: |
            vial.apk
            vial-${{ inputs.version_name }}.apk
          make_latest: 'true'
      - name: Avisar a Vial (lista)
        if: success()
        run: |
          curl -s -X POST https://yjnlfewsgksdsvsimdjs.supabase.co/functions/v1/vial-admin \
            -H "Content-Type: application/json" -H "x-ci-secret: ${{ secrets.VIAL_CI_SECRET }}" \
            -d '{"accion":"version_lista","ok":true,"version_code":${{ inputs.version_code }},"apk_url":"https://github.com/${{ github.repository }}/releases/download/v${{ inputs.version_name }}/vial.apk"}'
      - name: Avisar a Vial (falló)
        if: failure()
        run: |
          curl -s -X POST https://yjnlfewsgksdsvsimdjs.supabase.co/functions/v1/vial-admin \
            -H "Content-Type: application/json" -H "x-ci-secret: ${{ secrets.VIAL_CI_SECRET }}" \
            -d '{"accion":"version_lista","ok":false,"version_code":${{ inputs.version_code }}}'
